{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - GoSport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS PROPIO -->
    <link rel="stylesheet" href="{% static 'css/contacto.css' %}">
</head>

<body>

<!-- NAVBAR DEPORTIVA -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center fw-bold text-success" href="{% url 'reservas:home' %}">
            <img src="{% static 'img/icono.jpg' %}" alt="logo" width="35" height="35" class="me-2 rounded-circle">
            GOSPORT 
        </a>

    </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-5">
    <div class="row justify-content-center">

        <!-- FORMULARIO -->
        <div class="col-md-6">

            <div class="card shadow-lg border-0 p-4 rounded-4">

                <h3 class="text-center mb-4 fw-bold text-success">
                     Contáctanos
                </h3>

                <!-- MENSAJES -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-success text-center rounded-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre</label>
                        <input type="text" name="nombre" class="form-control rounded-3" placeholder="Tu nombre" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo</label>
                        <input type="email" name="correo" class="form-control rounded-3" placeholder="correo@email.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mensaje</label>
                        <textarea name="mensaje" class="form-control rounded-3" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-success w-100 fw-bold rounded-3">
                         Enviar mensaje
                    </button>
                </form>

                <a href="{% url 'reservas:home' %}" class="btn btn-dark w-100 mt-3 rounded-3">
                    ⬅ Volver al inicio
                </a>

            </div>

        </div>

        <!-- WHATSAPP -->
        <div class="col-md-5 mt-4 mt-md-0">

            <div class="card shadow-lg border-0 p-3 rounded-4 d-flex flex-row align-items-center gap-3">

                <img src="{% static 'img/whatsapp.jpg' %}" alt="WhatsApp" width="60" height="60" class="rounded-circle">

                <div>
                    <h5 class="fw-bold mb-1">WhatsApp</h5>
                    <p class="mb-1">+57 3024904038</p>
                    <a href="https://wa.me/573024904038" target="_blank" class="text-success fw-bold text-decoration-none">
                         Escríbenos aquí
                    </a>
                </div>

            </div>

        </div>

    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    © 2026 GoSport - Sistema de gestión deportiva
</footer>

<!-- AUTO OCULTAR MENSAJE -->
<script>
setTimeout(() => {
    const alerta = document.querySelector('.alert');
    if(alerta){
        alerta.style.display = 'none';
    }
}, 4000);
</script>

</body>
</html>

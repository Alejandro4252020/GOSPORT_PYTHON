{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - GoSport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS PROPIO -->
    <link rel="stylesheet" href="{% static 'css/contacto.css' %}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="{% url 'reservas:home' %}">
            <img src="{% static 'img/icono.jpg' %}" alt="logo" width="40" height="40" class="me-2">
            GOSPORT
        </a>

    </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-5">
    <div class="row justify-content-center">

        <!-- FORMULARIO -->
        <div class="col-md-6">

            <div class="card shadow-lg p-4">

                <h3 class="text-center mb-4">Contáctanos</h3>

                <!-- MENSAJE DE ÉXITO (CORREGIDO) -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-success text-center mt-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Tu nombre" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" name="correo" class="form-control" placeholder="correo@email.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <textarea name="mensaje" class="form-control" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Enviar mensaje 
                    </button>
                </form>

                <a href="{% url 'reservas:home' %}" class="btn btn-dark mt-3 w-100">
                    ← Volver al inicio
                </a>

            </div>

        </div>

        <!-- WHATSAPP -->
        <div class="col-md-5 mt-4 mt-md-0">
            <div class="whatsapp-card">
                <img src="{% static 'img/whatsapp.jpg' %}" alt="WhatsApp">

                <div>
                    <h5>WhatsApp</h5>
                    <p>+57 3024904038</p>
                    <a href="https://wa.me/+57 3024904038" target="_blank">
                        Escríbenos por WhatsApp
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<footer>
    <div class="footer-content">
        <span>© 2026 GoSport - Todos los derechos reservados</span>
    </div>
</footer>

<!-- OPCIONAL: ocultar mensaje automáticamente -->
<script>
setTimeout(() => {
    const alerta = document.querySelector('.alert');
    if(alerta){
        alerta.style.display = 'none';
    }
}, 4000);
</script>

</body>
</html>

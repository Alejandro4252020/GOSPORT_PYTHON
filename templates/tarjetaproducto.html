<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Detalle del Producto</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="/static/css/tarjetaproducto.css">
<link rel="icon" type="image/png" href="/static/img/icono.jpg">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">

<div class="container d-flex align-items-center justify-content-between">

<a class="navbar-brand d-flex align-items-center" href="/">

<img src="/static/img/icono.jpg" class="me-2" style="height:40px;">

<span class="fw-bold">GOSPORT</span>

</a>

<div class="collapse navbar-collapse">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="/catalogo">Tienda GS</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/canchas">Canchas</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/carrito">Carrito</a>
</li>

</ul>

</div>
</div>
</nav>


<!-- CONTENIDO -->

<div class="container my-5">

<!-- BOTON VOLVER -->

<div class="text-center mt-4" style="position:absolute; top:80px; left:15px;">

<a href="/catalogo" class="btn-volver">
Volver
</a>

</div>

<br><br>


<div class="card shadow-sm p-4">

<div class="row g-4 align-items-center">


<!-- IMAGEN -->

<div class="col-md-6 text-center">

<img src="/static/img/{{ producto.imagen }}"
alt="{{ producto.nombre }}"
class="img-producto">

</div>


<!-- INFO PRODUCTO -->

<div class="col-md-6">

<h2 class="fw-bold">
{{ producto.nombre }}
</h2>

<span class="badge bg-success mb-3">Disponible</span>

<p class="mt-3 text-muted">

{{ producto.descripcion }}

</p>


<h4 class="text-primary fw-bold mt-3">

${{ producto.precio }} COP

</h4>


<!-- CANTIDAD -->

<div class="mb-3">

<label for="cantidad" class="form-label">Cantidad:</label>

<input type="number" id="cantidad" class="form-control" min="1" value="1">

</div>


<div class="d-grid mt-4">

<form action="/carrito/agregar" method="post">

<input type="hidden" name="productoId" value="{{ producto.id }}">

<input type="hidden" name="cantidad" id="cantidadHidden">

<button type="submit" class="btn btn-primary btn-lg">

Comprar ahora

</button>

</form>

</div>

</div>

</div>

</div>

</div>


<script>

const cantidadInput = document.getElementById("cantidad");
const cantidadHidden = document.getElementById("cantidadHidden");

cantidadInput.addEventListener("change", () => {

cantidadHidden.value = cantidadInput.value;

});

cantidadHidden.value = cantidadInput.value;

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<footer class="text-center py-3 mt-4">

<p>© 2026 GoSports - Sistema de gestión deportiva</p>

</footer>

</body>
</html>

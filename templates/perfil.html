{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>GOSPORT - PERFIL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/perfil.css' %}">
<link rel="icon" type="image/png" href="{% static 'img/icono.jpg' %}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
<div class="container">

<a class="navbar-brand d-flex align-items-center" href="/">
<img src="{% static 'img/icono.jpg' %}" style="height:40px" class="me-2">
<span class="fw-bold">GOSPORT</span>
</a>

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="/">Inicio</a>
</li>

<li class="nav-item">
<form method="post" action="{% url 'auth:logout' %}" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger ms-3">
        Cerrar Sesión
    </button>
</form>
</li>

</ul>

</div>
</nav>

<!-- PERFIL -->
<div class="container py-4">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-sm p-4">

<h2 class="text-center mb-4">Mi Perfil</h2>

<h4 class="text-center">
Entonces, parcero, esta cuenta se llama 
<span class="fw-bold">{{ request.user.username }}</span>
</h4>

<form method="post" action="/perfil/editar" enctype="multipart/form-data">

{% csrf_token %}

<!-- FOTO PERFIL -->
<div class="text-center mb-3">

<img src="{% static 'img/perfil.jpg' %}"
width="150"
height="150"
class="rounded-circle mb-2">

<input type="file" name="foto" class="form-control mt-2">

</div>

<!-- USUARIO -->
<div class="mb-3">

<label class="form-label">Nombre de usuario</label>

<input type="text"
name="nombre"
class="form-control"
value="{{ request.user.username }}"
required>

</div>

<!-- PASSWORD -->
<div class="mb-3">

<label class="form-label">Nueva contraseña</label>

<input type="password"
name="password"
class="form-control"
placeholder="Dejar vacío si no cambia">

</div>

<div class="d-grid">

<button type="submit" class="btn btn-primary btn-lg">
Actualizar Perfil
</button>

</div>

</form>

</div>

</div>

</div>

</div>

<!-- FOOTER -->
<footer class="text-center py-3 mt-4">

<p>© 2026 GoSports - Sistema de gestión deportiva</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

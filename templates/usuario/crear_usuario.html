{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Usuario - GoSport</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{% static 'css/crear_usuario.css' %}">
    <!-- Icono -->
    <link rel="icon" href="{% static 'img/icono.jpg' %}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <img src="{% static 'img/icono.jpg' %}" class="me-2" style="height:40px;">
        <div class="logo">GOSPORTS</div>
        <div class="nav-links">
            <a href="{% url 'usuarios:lista_usuarios' %}">Usuarios</a>
            <a href="{% url 'usuarios:crear_usuario' %}">Crear Usuario</a>
            <form method="post" action="{% url 'auth:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm">
                    Cerrar Sesión
                </button>
            </form>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="container">
        <div class="card-form">
            <h2>Crear Usuario</h2>

            <form method="POST">
                {% csrf_token %}

                <label>Nombre de usuario:</label>
                <input type="text" name="username" required>

                <label>Correo electrónico:</label>
                <input type="email" name="email" required>

                <label>Contraseña:</label>
                <div class="password-container">
                    <input type="password" name="password" id="password" required>
                    <button type="button" onclick="togglePassword()">👁</button>
                </div>

                <label>Rol:</label>
                <select name="rol">
                    <option value="cliente">Cliente</option>
                    <option value="empleado">Empleado</option>
                    <option value="admin">Administrador</option>
                </select>

                <button type="submit" class="btn-submit">Crear Usuario</button>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        © 2025 GoSports - Sistema de gestión deportiva
    </footer>

    <!-- SCRIPT -->
    <script>
    function togglePassword() {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
    }
    </script>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/dashboard2.css' %}">

    <link rel="icon" href="{% static 'img/icono.jpg' %}?v=2">
</head>

<body>

<!-- NAVBAR -->
<header class="topbar">
    <div class="topbar-content">

    <!-- IZQUIERDA -->
    <div class="logo-title">
        <span class="go">Go</span><span class="sports">Sports</span>
    </div>

    <!-- DERECHA -->
    <div class="user-section">
        <span class="text-white">{{ request.user.username }}</span>
      <form method="post" action="{% url 'auth:logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger btn-sm">Salir</button>
      </form>
    </div>

</div>
</header>

<main>
<!-- CONTENIDO -->
<div class="container mt-4">

    <h3 class="text-center" style="color:#000000;">Bienvenido, {{ request.user.username }} 👋</h3>

    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Reservas</h5>
                <p>Gestiona tus reservas deportivas</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Canchas</h5>
                <p>Ver disponibilidad</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Perfil</h5>
                <p>Editar información</p>
            </div>
        </div>

    </div>

</div>
</main>

<footer>
    © 2025 GoSports
    <button id="themeToggle" class="btn btn-sm btn-light">🌙</button>
    </div>
</footer>

<script>
    const toggleBtn = document.getElementById("themeToggle");

    // Detectar sistema
    if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.body.classList.add("light");
    }

    toggleBtn.addEventListener("click", () => {
        document.body.classList.toggle("light");
    });
    </script>
</body>
</html>

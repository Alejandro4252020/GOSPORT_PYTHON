{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - GoSports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <link rel="icon" href="{% static 'img/icono.jpg' %}">
</head>
<body>

<!-- HEADER -->
<header class="topbar">
    <div class="topbar-content">
        <div class="logo-title">
            <img src="{% static 'img/icono.jpg' %}" alt="Logo" class="me-2" style="height:40px;">
            <span class="go">Go</span><span class="sports">Sports</span>
        </div>

        <a href="{% url 'auth:login' %}" class="login-link">Login</a>
    </div>
</header>

<!-- MAIN -->
<main>
    <div class="card-form">

        <h3 class="text-center mb-4">Crear cuenta</h3>

        {% for message in messages %}
            <p class="error-msg">{{ message }}</p>
        {% endfor %}

        <form method="POST" autocomplete="off">
            {% csrf_token %}

            <!-- Correo -->
            <div class="mb-3">
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Correo electrónico"
                    required
                    autocomplete="email">
            </div>

            <!-- Usuario -->
            <div class="mb-3">
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Usuario"
                    required
                    autocomplete="username">
            </div>

            <!-- Contraseña -->
            <div class="input-group mb-3">
                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Contraseña"
                    required
                    autocomplete="new-password"
                    minlength="8">

                <button type="button" class="btn btn-outline-secondary" id="togglePass">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <!-- Confirmar contraseña -->
            <div class="input-group mb-2">
                <input
                    type="password"
                    name="password2"
                    id="password2"
                    class="form-control"
                    placeholder="Confirmar contraseña"
                    required
                    autocomplete="new-password"
                    minlength="8">

                <button type="button" class="btn btn-outline-secondary" id="togglePass2">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <!-- Mensaje de coincidencia -->
            <small id="matchMsg" style="display:none;"></small>

            <button type="submit" class="btn btn-custom w-100 mt-3">
                Registrarse
            </button>
        </form>

    </div>
</main>

<!-- FOOTER -->
<footer>
    © 2025 GoSports
</footer>

<script>
    // Mostrar/Ocultar contraseña principal
    document.getElementById("togglePass").addEventListener("click", function () {
        const pass = document.getElementById("password");
        const icon = this.querySelector("i");

        if (pass.type === "password") {
            pass.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        } else {
            pass.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
    });

    // Mostrar/Ocultar confirmar contraseña
    document.getElementById("togglePass2").addEventListener("click", function () {
        const pass = document.getElementById("password2");
        const icon = this.querySelector("i");

        if (pass.type === "password") {
            pass.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        } else {
            pass.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
    });

    // Validación en tiempo real
    const pass1 = document.getElementById("password");
    const pass2 = document.getElementById("password2");
    const form = document.querySelector("form");
    const matchMsg = document.getElementById("matchMsg");

    function checkMatch() {
        if (pass2.value === "") {
            matchMsg.style.display = "none";
            pass2.style.borderColor = "";
            return;
        }

        matchMsg.style.display = "block";

        if (pass1.value === pass2.value) {
            matchMsg.textContent = "✓ Las contraseñas coinciden";
            matchMsg.style.color = "#198754";
            pass2.style.borderColor = "#198754";
        } else {
            matchMsg.textContent = "✗ Las contraseñas no coinciden";
            matchMsg.style.color = "#dc3545";
            pass2.style.borderColor = "#dc3545";
        }
    }

    pass1.addEventListener("input", checkMatch);
    pass2.addEventListener("input", checkMatch);

    // Validación antes de enviar
    form.addEventListener("submit", function (e) {

        if (pass1.value.length < 8) {
            e.preventDefault();
            alert("La contraseña debe tener al menos 8 caracteres.");
            return;
        }

        if (pass1.value !== pass2.value) {
            e.preventDefault();
            alert("Las contraseñas no coinciden.");
        }
    });
</script>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - GoSports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <link rel="icon" href="{% static 'img/icono.jpg' %}">
</head>
<body>

<!-- HEADER -->
<header class="topbar">
    <div class="topbar-content">
        <div class="logo-title">
            <img src="{% static 'img/icono.jpg' %}" class="me-2" style="height:40px;"> 
            <span class="go">Go</span><span class="sports">Sports</span>
        </div>

        <a href="{% url 'auth:login' %}" class="login-link">Login</a>
    </div>
</header>

<!-- MAIN -->
<main>
    <div class="card-form">

        <h3 class="text-center mb-4">Crear cuenta</h3>

        {% for message in messages %}
            <p class="error-msg">{{ message }}</p>
        {% endfor %}

        <form method="POST" autocomplete="off">
            {% csrf_token %}

            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required autocomplete="email">
            </div>

            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Usuario" required autocomplete="username">
            </div>

            <div class="input-group mb-3">
                <input type="password" name="password" id="password" class="form-control"
                    placeholder="Contraseña"
                    required
                    autocomplete="new-password"
                    minlength="8">
                    
                <button type="button" class="btn" id="togglePass">👁</button>
            </div>

            <button type="submit" class="btn btn-custom w-100">Registrarse</button>
        </form>
    </div>
</main>

<!-- FOOTER -->
<footer>
    © 2025 GoSports
</footer>

<script>
    // Mostrar / ocultar contraseña
    document.getElementById("togglePass").addEventListener("click", function () {
        const pass = document.getElementById("password");
        pass.type = pass.type === "password" ? "text" : "password";
    });

</script>

</body>
</html>

<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>{{ cancha.nombre }}</title>

<link rel="stylesheet" href="/static/css/detalle-cancha.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="icon" type="image/png" href="/static/img/icono.jpg">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
<div class="container">

<a class="navbar-brand d-flex align-items-center" href="/">
<img src="/static/img/icono.jpg" style="height:40px" class="me-2">
<span class="fw-bold">GOSPORT</span>
</a>

</div>
</nav>

<!-- CONTENIDO -->

<div class="container mt-4">

<a href="/canchas" class="btn btn-secondary">Volver</a>

<br><br>

<div class="card shadow p-4">

<div class="row">

<!-- IMAGEN -->
<div class="col-md-6 text-center">

<img src="/static/img/{{ cancha.imagen }}" 
class="img-fluid rounded">

</div>

<!-- INFORMACION -->

<div class="col-md-6">

<h2>{{ cancha.nombre }}</h2>

{% if cancha.estado == "Disponible" %}
<p class="fw-bold text-success">Disponible</p>
{% else %}
<p class="fw-bold text-danger">{{ cancha.estado }}</p>
{% endif %}

<p>{{ cancha.descripcion }}</p>

<p>
<strong>Dirección:</strong>

<a href="https://www.google.com/maps/search/?api=1&query={{ cancha.direccion }}" target="_blank">
Abrir en Google Maps
</a>

</p>

<a href="#" class="btn btn-primary w-100 mt-3">
Reservar
</a>

</div>

</div>

</div>

</div>

<footer class="text-center py-3 mt-4">
<p>© 2025 GoSports - Sistema de gestión deportiva</p>
</footer>

</body>
</html>

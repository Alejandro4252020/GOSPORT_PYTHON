<!DOCTYPE html>
<html>
<head>
    <title>Canchas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Listado de Canchas</h2>

<a href="/canchas/crear/" class="btn btn-primary mb-3">Agregar nueva cancha</a>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Ubicación</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        {% for cancha in canchas %}
        <tr>
            <td>{{ cancha.id }}</td>
            <td>{{ cancha.nombre }}</td>
            <td>{{ cancha.ubicacion }}</td>
            <td>${{ cancha.precio }}</td>
            <td>
                <a href="/canchas/editar/{{ cancha.id }}/" class="btn btn-warning btn-sm">Editar</a>

                <a href="/canchas/eliminar/{{ cancha.id }}/"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar esta cancha?')">
                   Eliminar
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>

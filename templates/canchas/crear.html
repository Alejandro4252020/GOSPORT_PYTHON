<!DOCTYPE html>
<html>
<head>
    <title>Crear Cancha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Crear Cancha</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre">
    <input type="text" name="ubicacion" class="form-control mb-2" placeholder="Ubicación">
    <input type="number" name="precio" class="form-control mb-2" placeholder="Precio">

    <button class="btn btn-success">Guardar</button>
</form>

</body>
</html>

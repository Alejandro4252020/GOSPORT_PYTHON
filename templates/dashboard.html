{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">
        <span style="color:#00ffcc;">Go</span>Sports
    </span>

    <div>
        <span class="text-white me-3">{{ request.user.username }}</span>
        <a href="/login" class="btn btn-danger btn-sm">Salir</a>
    </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-4">

    <h3>Bienvenido, {{ request.user.username }} 👋</h3>

    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Reservas</h5>
                <p>Gestiona tus reservas deportivas</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Canchas</h5>
                <p>Ver disponibilidad</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Perfil</h5>
                <p>Editar información</p>
            </div>
        </div>

    </div>

</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS PERSONALIZADO -->
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body class="dashboard-body">

<div class="overlay"></div>

<div class="container py-5">

    <h1 class="text-center text-white mb-5">
        ⚽ Dashboard Gosport
    </h1>

    <div class="row text-center g-4">

        <!-- CARD 1 -->
        <div class="col-md-4">
            <div class="card-dashboard green">
                <h5>Total Productos</h5>
                <h2>{{ total_productos }}</h2>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="col-md-4">
            <div class="card-dashboard blue">
                <h5>Productos en Carrito</h5>
                <h2>{{ total_carrito }}</h2>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="col-md-4">
            <div class="card-dashboard orange">
                <h5>Total Dinero</h5>
                <h2>${{ total_dinero }}</h2>
            </div>
        </div>

    </div>

    <div class="text-center mt-5">
        <a href="/" class="btn btn-light btn-lg">Volver al inicio</a>
    </div>

</div>

</body>
</html>

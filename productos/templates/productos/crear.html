{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Producto - GoSport</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/crear_productos.css' %}">

    <!-- Icono -->
    <link rel="icon" href="{% static 'img/icono.jpg' %}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <img src="{% static 'img/icono.jpg' %}" class="me-2" style="height:40px;">
        <div class="logo">GoSport</div>
        <div class="nav-links">
            <a href="{% url 'productos:lista_productos' %}">Productos</a>
            <a href="{% url 'productos:crear_producto' %}">Crear Producto</a>
            {% if request.user.is_superuser %}
            <a href="{% url 'usuarios:lista_usuarios' %}">Usuarios</a>
            {% endif %}
            <form method="post" action="{% url 'auth:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm">
                    Cerrar Sesión
                </button>
            </form>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="container">
        <div class="card-form">

            <h2>Agregar Producto</h2>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <label>Nombre:</label>
                <input type="text" name="nombre" required>

                <label>Precio:</label>
                <input type="number" name="precio" step="0.01" required>

                <label>Stock:</label>
                <input type="number" name="stock" min="0" required>

                <label>Categoría:</label>
                <input type="text" name="categoria" required>

                <label>Descripción:</label>
                <textarea name="descripcion" rows="4"></textarea>

                <label>Imagen:</label>
                <input type="file" name="imagen" accept="image/*">

                <!-- BOTONES -->
                <div class="acciones">
                    <button type="submit" class="btn-submit">Guardar producto</button>
                    <a href="{% url 'productos:lista_productos' %}" class="btn-cancelar">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 GoSports - Sistema de gestión deportiva
    </footer>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto - GoSport</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/editar_productos.css' %}">

    <!-- Icono -->
    <link rel="icon" href="{% static 'img/icono.jpg' %}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <img src="{% static 'img/icono.jpg' %}" class="me-2" style="height:40px;">
        <div class="logo">GoSport</div>
        <div class="nav-links">
            <a href="{% url 'productos:lista_productos' %}">Productos</a>
            <a href="{% url 'productos:crear_producto' %}">Crear Producto</a>
            {% if request.user.is_superuser %}
            <a href="{% url 'usuarios:lista_usuarios' %}">Usuarios</a>
            {% endif %}
            <form method="post" action="{% url 'auth:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm">
                    Cerrar Sesión
                </button>
            </form>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="container">
        <div class="card-form">

            <h2>Editar Producto</h2>

            <form method="POST" enctype="multipart/form-data" id="form-editar-producto">
                {% csrf_token %}

                <label>Nombre:</label>
                <input type="text" name="nombre" value="{{ producto.nombre }}" required>

                <label>Precio:</label>
                <input type="text" id="precio_visual" inputmode="numeric" placeholder="Ej: 280.000" required>
                <input type="hidden" name="precio" id="precio_real" value="{{ producto.precio|floatformat:0 }}">

                <label>Stock:</label>
                <input type="number" name="stock" min="0" value="{{ producto.stock }}" required>

                <label>Categoría:</label>
                <input type="text" name="categoria" value="{{ producto.categoria }}" required>

                <label>Descripción:</label>
                <textarea name="descripcion" rows="4">{{ producto.descripcion }}</textarea>

                <label>Imagen actual:</label>
                <div class="preview-img">
                    {% if producto.imagen %}
                        <img src="{{ producto.imagen.url }}">
                    {% else %}
                        <span>Sin imagen</span>
                    {% endif %}
                </div>

                <label>Cambiar imagen:</label>
                <input type="file" name="imagen" accept="image/*">

                <!-- BOTONES -->
                <div class="acciones">
                    <button type="submit" class="btn-submit">Guardar cambios</button>
                    <a href="{% url 'productos:lista_productos' %}" class="btn-cancelar">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 GoSports - Sistema de gestión deportiva
    </footer>

    <!-- Formateo de precio con puntos de miles -->
    <script>
        const precioVisual = document.getElementById('precio_visual');
        const precioReal = document.getElementById('precio_real');
        const formEditarProducto = document.getElementById('form-editar-producto');

        // Precarga el valor actual ya formateado con puntos de miles
        if (precioReal.value) {
            precioVisual.value = parseInt(precioReal.value, 10).toLocaleString('es-CO');
        }

        precioVisual.addEventListener('input', function () {
            let soloNumeros = this.value.replace(/\D/g, '');

            if (soloNumeros === '') {
                this.value = '';
                precioReal.value = '';
                return;
            }

            this.value = parseInt(soloNumeros, 10).toLocaleString('es-CO');
            precioReal.value = soloNumeros;
        });

        formEditarProducto.addEventListener('submit', function (e) {
            if (!precioReal.value) {
                e.preventDefault();
                precioVisual.focus();
            }
        });
    </script>

</body>
</html>
